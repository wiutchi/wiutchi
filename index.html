<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #333; overflow: hidden; display: flex; align-items: center; height: 100vh; }
  .road { position: absolute; width: 100%; height: 10px; background: white; top: 60%; }
  .car {
    font-size: 50px;
    position: absolute;
    bottom: 40%;
    animation: drive 5s linear infinite;
  }
  @keyframes drive {
    from { left: -100px; }
    to { left: 100%; }
  }
</style>
</head>
<body>
  <div class="road"></div>
  <div class="car">🏎️</div>
</body>
</html>
